<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Spline+Sans+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Settle the theme before first paint so the page never flashes the
			// wrong ground colour.
			(() => {
				try {
					const saved = localStorage.getItem('theme');
					const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = saved ?? (prefersDark ? 'dark' : 'light');
				} catch {
					// Private browsing can throw on storage access; the light default stands.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
