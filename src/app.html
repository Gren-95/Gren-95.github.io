<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/bricolage-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/archivo-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/spline-mono-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Settle the theme before first paint so the page never flashes the
			// wrong ground colour.
			(() => {
				try {
					const saved = localStorage.getItem('theme');
					const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = saved ?? (prefersDark ? 'dark' : 'light');
				} catch {
					// Private browsing can throw on storage access; the light default stands.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
